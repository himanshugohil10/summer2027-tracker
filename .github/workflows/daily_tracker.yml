name: Daily Summer 2027 Internship & Alumni Tracker

on:
  schedule:
    # Runs at 13:00 UTC (9:00 AM EST) Mon-Fri
    - cron: '0 13 * * 1-5'
  workflow_dispatch: # Allows manual trigger from Actions tab anytime

jobs:
  track-jobs:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit updated cache back to repo

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Pipeline
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python tracker.py

      - name: Commit Updated Seen Jobs Cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update seen_jobs cache [skip ci]" && git push)

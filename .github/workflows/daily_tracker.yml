name: Daily Summer 2027 Internship & Alumni Tracker

on:
  schedule:
    # GitHub starts scheduled runs late (sometimes hours) and drops some, so a
    # few spread-out triggers are used and scripts/gate.sh decides what to do.
    # Each mode runs at most once per Boston day: discover first (any time after
    # ~8:40 AM), then enrich (after ~2:50 PM, once discover has succeeded).
    # Extra triggers that find nothing to do exit in a few seconds.
    # Times are UTC; Boston is UTC-5 (EST) or UTC-4 (EDT).
    - cron: '45 13 * * *'   # ~8:45 AM  discover (first try)
    - cron: '17 15 * * *'   # ~10:17 AM discover (retry)
    - cron: '17 17 * * *'   # ~12:17 PM discover (retry)
    - cron: '7 20 * * *'    # ~3:07 PM  enrich (first try)
    - cron: '17 22 * * *'   # ~5:17 PM  enrich (retry)
    - cron: '17 0 * * *'    # ~7:17 PM  last retry for either
  workflow_dispatch:
    inputs:
      mode:
        description: 'discover (job/alumni search) or enrich (email filler)'
        required: true
        default: 'discover'

permissions:
  contents: write

# Never let two runs overlap (prevents git push conflicts and double Discord posts)
concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track-and-enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Decide mode (Boston-time catch-up gate)
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: bash scripts/gate.sh decide

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install requests google-api-python-client google-auth

      - name: Run Tracker or Email Enricher
        if: steps.gate.outputs.run == 'true'
        env:
          TZ: 'America/New_York'
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ "${{ steps.gate.outputs.mode }}" = "enrich" ]; then
            python tracker.py --enrich
          else
            python tracker.py
          fi

      - name: Record successful run and commit state
        if: steps.gate.outputs.run == 'true'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # Only scheduled runs set the once-per-day marker; manual runs don't block the schedule.
          if [ "$EVENT" != "workflow_dispatch" ]; then
            bash scripts/gate.sh mark "${{ steps.gate.outputs.mode }}" "${{ steps.gate.outputs.date }}"
          fi
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add seen_jobs.json
          [ -f run_state.json ] && git add run_state.json
          git diff --staged --quiet || git commit -m "Auto-update tracker state (${{ steps.gate.outputs.mode }})"
          git pull --rebase
          git push

      - name: Alert Discord on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\": \"❌ Tracker workflow FAILED (${{ steps.gate.outputs.mode }}). Check GitHub Actions logs.\"}" \
            "$WEBHOOK"

name: Daily Summer 2027 Internship & Alumni Tracker

on:
  schedule:
    # BACKUP triggers only (GitHub drops/delays scheduled runs). The primary
    # trigger is the Apps Script clock (see apps_script/), which calls
    # workflow_dispatch at 7:30 AM / 6:30 PM IST. scripts/gate.sh makes sure each
    # mode runs at most once per IST day, so duplicates exit in seconds.
    # IST = UTC+5:30, no daylight saving, so these never shift.
    - cron: '7 2 * * *'     # 7:37 AM IST  discover
    - cron: '17 3 * * *'    # 8:47 AM IST  discover (retry)
    - cron: '17 5 * * *'    # 10:47 AM IST discover (retry)
    - cron: '7 13 * * *'    # 6:37 PM IST  enrich
    - cron: '17 15 * * *'   # 8:47 PM IST  enrich (retry)
    - cron: '17 17 * * *'   # 10:47 PM IST last retry
  workflow_dispatch:
    inputs:
      mode:
        description: 'discover (job/alumni search) or enrich (email filler)'
        required: true
        default: 'discover'
      trigger:
        description: 'auto = counts as the daily scheduled run (used by Apps Script); manual = always runs, ignores daily marker'
        required: false
        default: 'manual'

permissions:
  contents: write

# Never let two runs overlap (prevents git push conflicts and double Discord posts)
concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track-and-enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Decide mode (IST catch-up gate)
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_TRIGGER: ${{ github.event.inputs.trigger }}
        run: bash scripts/gate.sh decide

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install requests google-api-python-client google-auth

      - name: Run Tracker or Email Enricher
        if: steps.gate.outputs.run == 'true'
        env:
          TZ: 'Asia/Kolkata'
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ "${{ steps.gate.outputs.mode }}" = "enrich" ]; then
            python tracker.py --enrich
          else
            python tracker.py
          fi

      - name: Record successful run and commit state
        if: steps.gate.outputs.run == 'true'
        run: |
          # Scheduled and trigger=auto runs set the once-per-day marker; manual runs don't.
          if [ "${{ steps.gate.outputs.mark }}" = "true" ]; then
            bash scripts/gate.sh mark "${{ steps.gate.outputs.mode }}" "${{ steps.gate.outputs.date }}"
          fi
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add seen_jobs.json
          [ -f run_state.json ] && git add run_state.json
          git diff --staged --quiet || git commit -m "Auto-update tracker state (${{ steps.gate.outputs.mode }})"
          git pull --rebase
          git push

      - name: Alert Discord on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\": \"❌ Tracker workflow FAILED (${{ steps.gate.outputs.mode }}). Check GitHub Actions logs.\"}" \
            "$WEBHOOK"

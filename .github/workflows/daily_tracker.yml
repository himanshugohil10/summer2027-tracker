name: Daily Summer 2027 Internship & Alumni Tracker

on:
  schedule:
    # All timings are IST (UTC+5:30, no daylight saving, so nothing ever shifts).
    # Goal: discover in the Boston morning (~7:30 PM IST) and enrich in the Boston
    # afternoon (~1:30 AM IST), once each per cycle (a cycle rolls over at noon
    # IST). scripts/gate.sh enforces the IST windows and the once-per-cycle
    # marker, so any extra or mistimed trigger exits in seconds.
    # GitHub cron is best-effort (often hours late), so the Apps Script clock is
    # the punctual trigger (workflow_dispatch with trigger=auto at 19:30 IST for
    # discover and 01:30 IST for enrich). These cron lines are backups (UTC).
    - cron: '45 13 * * *'   # 7:15 PM IST discover
    - cron: '17 15 * * *'   # 8:47 PM IST discover (retry)
    - cron: '17 17 * * *'   # 10:47 PM IST discover (retry)
    - cron: '7 20 * * *'    # 1:37 AM IST enrich
    - cron: '17 22 * * *'   # 3:47 AM IST enrich (retry)
    - cron: '17 0 * * *'    # 5:47 AM IST enrich (last retry)
  workflow_dispatch:
    inputs:
      mode:
        description: 'discover (job/alumni search) or enrich (email filler)'
        required: true
        default: 'discover'
      trigger:
        description: 'auto = counts as the daily scheduled run (used by Apps Script); manual = always runs, ignores daily marker'
        required: false
        default: 'manual'

permissions:
  contents: write

# Never let two runs overlap (prevents git push conflicts and double Discord posts)
concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track-and-enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Decide mode (IST catch-up gate)
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_TRIGGER: ${{ github.event.inputs.trigger }}
        run: bash scripts/gate.sh decide

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install requests google-api-python-client google-auth

      - name: Run Tracker or Email Enricher
        if: steps.gate.outputs.run == 'true'
        env:
          TZ: 'Asia/Kolkata'
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ "${{ steps.gate.outputs.mode }}" = "enrich" ]; then
            python tracker.py --enrich
          else
            python tracker.py
          fi

      - name: Record successful run and commit state
        if: steps.gate.outputs.run == 'true'
        run: |
          # Scheduled and trigger=auto runs set the once-per-day marker; manual runs don't.
          if [ "${{ steps.gate.outputs.mark }}" = "true" ]; then
            bash scripts/gate.sh mark "${{ steps.gate.outputs.mode }}" "${{ steps.gate.outputs.date }}"
          fi
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add seen_jobs.json
          [ -f run_state.json ] && git add run_state.json
          git diff --staged --quiet || git commit -m "Auto-update tracker state (${{ steps.gate.outputs.mode }})"
          git pull --rebase
          git push

      - name: Alert Discord on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\": \"❌ Tracker workflow FAILED (${{ steps.gate.outputs.mode }}). Check GitHub Actions logs.\"}" \
            "$WEBHOOK"
